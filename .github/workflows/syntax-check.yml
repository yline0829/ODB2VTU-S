name: Syntax checks

on:
  push:
  pull_request:

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Compile Python sources
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path('src')
          if root.exists():
              for p in root.rglob('*.py'):
                  compile(p.read_text(encoding='utf-8'), str(p), 'exec')
                  print('OK', p)
          else:
              print('src/ not uploaded yet; documentation-only commit')
          PY
      - name: Run VTU inventory regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check shell syntax
        run: |
          if [ -d src ] || [ -d packaging ]; then
            find src packaging -name '*.sh' -type f 2>/dev/null | while read -r f; do bash -n "$f"; done
          else
            echo "No shell source directories yet"
          fi

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          if (Test-Path src) {
            Get-ChildItem -Recurse src -Filter *.ps1 | ForEach-Object {
              [scriptblock]::Create((Get-Content $_.FullName -Raw)) | Out-Null
              Write-Host "OK $($_.FullName)"
            }
          } else {
            Write-Host "src/ not uploaded yet; documentation-only commit"
          }
